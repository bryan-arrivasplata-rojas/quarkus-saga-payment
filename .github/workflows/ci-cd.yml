name: CI/CD Reactive Saga Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-run:
    name: "Build, Test & Ephemeral Public Run"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Dar permisos de ejecución al Maven Wrapper
        run: |
          chmod +x ./mvnw || true
          if [ -f "./saga-orchestrator/mvnw" ]; then chmod +x ./saga-orchestrator/mvnw; fi

      - name: Ejecutar pruebas unitarias (Unit Tests con H2 aislado)
        run: |
          echo "=== Ejecutando pruebas unitarias ==="
          if [ -d "saga-orchestrator" ]; then
            cd saga-orchestrator && ./mvnw test && cd ..
          else
            ./mvnw test
          fi

      - name: Empaquetar aplicación (Fast-JAR) con Swagger habilitado
        run: |
          echo "=== Empaquetando aplicación ==="
          if [ -d "saga-orchestrator" ]; then
            cd saga-orchestrator && ./mvnw package -DskipTests -Dquarkus.swagger-ui.always-include=true && cd ..
          else
            ./mvnw package -DskipTests -Dquarkus.swagger-ui.always-include=true
          fi

      # ========================================================
      # DESPLIEGUE EFÍMERO Y TÚNEL CONECTADO A NEON (5 MINUTOS)
      # ========================================================
      - name: Iniciar servicio conectado a Neon y exponer URL pública
        env:
          DB_JDBC_URL: ${{ secrets.DB_JDBC_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "=== 1. Instalando Cloudflare Tunnel ==="
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          echo "=== 2. Localizando binario Fast-JAR ==="
          JAR_PATH=$(find . -name "quarkus-run.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "Error: No se encontró quarkus-run.jar"
            exit 1
          fi

          echo "Iniciando servicio conectado a Neon PostgreSQL..."
          java \
            -Dquarkus.http.host=0.0.0.0 \
            -Dquarkus.http.port=8080 \
            -Dquarkus.swagger-ui.always-include=true \
            -Dquarkus.datasource.jdbc.url="$DB_JDBC_URL" \
            -Dquarkus.datasource.username="$DB_USERNAME" \
            -Dquarkus.datasource.password="$DB_PASSWORD" \
            -Dquarkus.hibernate-orm.database.generation=none \
            -jar "$JAR_PATH" > app.log 2>&1 &
          APP_PID=$!

          echo "Esperando que el servicio termine el arranque con Neon..."
          sleep 12

          echo "Verificando log de arranque:"
          cat app.log | head -n 35

          echo "=== 3. Iniciando túnel hacia el puerto 8080 ==="
          cloudflared tunnel --url http://127.0.0.1:8080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          sleep 8

          TUNNEL_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel.log | head -n 1)

          echo ""
          echo "=========================================================================="
          echo " ¡URL PÚBLICA CONECTADA A NEON ACTIVA POR 5 MINUTOS! "
          echo " URL Base:    $TUNNEL_URL"
          echo " Swagger UI:  $TUNNEL_URL/q/swagger-ui/"
          echo " OpenAPI Doc: $TUNNEL_URL/q/openapi"
          echo "=========================================================================="
          echo ""

          sleep 300

          echo "Tiempo cumplido (5 min). Apagando procesos..."
          kill -9 $TUNNEL_PID $APP_PID || true
          echo "Entorno temporal finalizado."
