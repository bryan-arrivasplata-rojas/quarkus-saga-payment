name: CI/CD Reactive Saga Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-run:
    name: "Build, Test & Ephemeral Run"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Dar permisos de ejecución al Maven Wrapper
        run: |
          chmod +x ./mvnw || true
          if [ -f "./saga-orchestrator/mvnw" ]; then chmod +x ./saga-orchestrator/mvnw; fi

      - name: Ejecutar pruebas unitarias (Unit Tests)
        run: |
          echo "=== Ejecutando pruebas unitarias con Java 25 ==="
          if [ -d "saga-orchestrator" ]; then
            cd saga-orchestrator && ./mvnw test && cd ..
          else
            ./mvnw test
          fi

      - name: Empaquetar aplicación (Fast-JAR)
        run: |
          echo "=== Empaquetando aplicación ==="
          if [ -d "saga-orchestrator" ]; then
            cd saga-orchestrator && ./mvnw package -DskipTests && cd ..
          else
            ./mvnw package -DskipTests
          fi

      - name: Iniciar servicio y mantener activo por 5 minutos
        run: |
          echo "=== Localizando binario Fast-JAR ==="
          JAR_PATH=$(find . -name "quarkus-run.jar" | head -n 1)
          
          if [ -z "$JAR_PATH" ]; then
            echo "Error: No se encontró quarkus-run.jar"
            exit 1
          fi

          echo "Iniciando servicio desde: $JAR_PATH"
          java -jar "$JAR_PATH" > app.log 2>&1 &
          APP_PID=$!

          echo "Esperando inicio del servicio..."
          sleep 12

          echo "Verificando endpoints locales:"
          curl -sI http://localhost:8080/q/openapi || true

          echo "=========================================================="
          echo "Servicio activo. Manteniendo encendido por 5 minutos..."
          echo "=========================================================="
          sleep 300

          echo "Tiempo cumplido (5 min). Apagando proceso..."
          kill -9 $APP_PID || true
          echo "Proceso finalizado exitosamente."
