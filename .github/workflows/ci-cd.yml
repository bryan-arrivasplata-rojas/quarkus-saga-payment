name: CI Saga Orchestrator Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Dar permisos de ejecución a los Maven Wrappers
        run: |
          chmod +x ./saga-orchestrator/mvnw || true
          chmod +x ./account-service/mvnw || true
          chmod +x ./payment-service/mvnw || true
          chmod +x ./notification-service/mvnw || true

      # ==========================================
      # 1. EJECUCIÓN DE PRUEBAS UNITARIAS
      # ==========================================
      - name: Ejecutar pruebas unitarias (Unit Tests)
        run: |
          echo "=== Corriendo tests de saga-orchestrator ==="
          cd saga-orchestrator && ./mvnw test && cd ..

          echo "=== Corriendo tests de account-service ==="
          cd account-service && ./mvnw test && cd ..

          echo "=== Corriendo tests de payment-service ==="
          cd payment-service && ./mvnw test && cd ..

          echo "=== Corriendo tests de notification-service ==="
          cd notification-service && ./mvnw test && cd ..

      # ==========================================
      # 2. COMPILACIÓN DE EMPAQUETADOS
      # ==========================================
      - name: Empaquetar aplicaciones (Fast-JAR)
        run: |
          cd account-service && ./mvnw package -DskipTests && cd ..
          cd payment-service && ./mvnw package -DskipTests && cd ..
          cd notification-service && ./mvnw package -DskipTests && cd ..
          cd saga-orchestrator && ./mvnw package -DskipTests && cd ..

      # ==========================================
      # 3. LEVANTAR SERVICIOS EN BACKGROUND (5 MIN)
      # ==========================================
      - name: Iniciar servicios y mantener activos por 5 minutos
        run: |
          echo "Iniciando microservicios..."
          
          # Arrancamos cada servicio en segundo plano guardando su PID
          java -jar account-service/target/quarkus-app/quarkus-run.jar &
          PID_ACCOUNT=$!

          java -jar payment-service/target/quarkus-app/quarkus-run.jar &
          PID_PAYMENT=$!

          java -jar notification-service/target/quarkus-app/quarkus-run.jar &
          PID_NOTIFICATION=$!

          java -jar saga-orchestrator/target/quarkus-app/quarkus-run.jar &
          PID_ORCHESTRATOR=$!

          echo "Esperando que los puertos estén listos..."
          sleep 10

          echo "Verificando estado de los servicios:"
          curl -I http://localhost:8080/q/openapi || true
          curl -I http://localhost:8081/accounts || true
          
          echo "=========================================================="
          echo "Servicios encendidos. Manteniendo activos por 5 minutos..."
          echo "=========================================================="
          sleep 300

          echo "Tiempo cumplido (5 min). Apagando microservicios de forma controlada..."
          kill -9 $PID_ACCOUNT $PID_PAYMENT $PID_NOTIFICATION $PID_ORCHESTRATOR || true
          echo "Todos los servicios han sido apagados."